name: Reproducible Bug Report
description: If you’re sure it’s reproducible and not just your machine, submit an issue so we can investigate
type: "Bug"
labels:
  - "bug"
body:
  - type: checkboxes
    attributes:
      label: Verification
      description: Please verify that you’ve followed these steps
      options:
        - label: I understand that [if I ignore these instructions, my issue may be closed without review](https://github.com/open-tap/homebrew-casks/blob/HEAD/doc/faq/closing_issues_without_review.md).
          required: true
        - label: I ran `brew update-reset && brew update` and retried my command.
          required: false
        - label: I ran `brew doctor`, fixed as many issues as possible and retried my command.
          required: false
        - label: I have read the [troubleshooting guide](https://github.com/open-tap/homebrew-casks/blob/HEAD/doc/reporting_bugs/error_examples.md) and confirmed this is not a common issue.
          required: true
        - label: I did not use AI/LLM to create this issue, or I disclosed the tool and model used; I will answer maintainer questions myself without AI/LLM.
          required: true
  - type: textarea
    attributes:
      label: Description of issue
    validations:
      required: true
  - type: input
    attributes:
      label: Command that failed
    validations:
      required: true
  - type: textarea
    attributes:
      label: Output of command with `--verbose --debug`
      render: shell
    validations:
      required: true
  - type: textarea
    attributes:
      label: Output of `brew doctor` and `brew config`
      render: shell
    validations:
      required: true
  - type: textarea
    attributes:
      label: Output of `brew tap`
      render: shell
    validations:
      required: true
